<app-passenger-navbar></app-passenger-navbar>

<div class="container py-5">

  <h2 class="text-center text-success mb-4">
    Pending Ride Requests
  </h2>

  <div *ngIf="requests.length === 0"
       class="alert alert-info text-center">
    No pending requests
  </div>

  <div class="card request-card mb-4"
       *ngFor="let req of requests">

    <div class="card-body">

      <h5>From: {{ req.startName }}</h5>
      <h6>To: {{ req.endName }}</h6>

      <p>Distance: {{ req.distance }} km</p>
      <p>Passengers: {{ req.passengersCount }}</p>
      <p>Trip Type: {{ req.tripType }}</p>
      <p>Vehicle: {{ req.vehiclePreference }}</p>
      <p>Estimated Fare: ₹ {{ req.estimatedFare }}</p>

      <div class="mt-3 d-flex gap-3">
        <button class="btn btn-success"
                (click)="acceptRequest(req)">
          Accept
        </button>

        <button class="btn btn-danger"
                (click)="rejectRequest(req)">
          Reject
        </button>
      </div>

    </div>

  </div>

</div>
