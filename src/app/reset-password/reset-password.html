<div class="login-bg">

  <div class="login-card">

    <h2>Reset Password</h2>

    <input
      type="password"
      placeholder="New Password"
      [(ngModel)]="password"
    >

    <input
      type="password"
      placeholder="Confirm Password"
      [(ngModel)]="confirmPassword"
    >

    <button (click)="resetPassword()" [disabled]="loading">
      {{ loading ? 'Updating...' : 'Reset Password' }}
    </button>

  </div>

</div>
