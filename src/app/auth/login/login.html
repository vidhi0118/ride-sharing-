<div class="login-bg">

  <div class="login-card">

    <span class="close-btn" (click)="goHome()">✕</span>

    <h2>Login your Account</h2>
    <p class="subtitle">
      Since this is your first trip, you'll need to provide some information before you can check out.
    </p>

    <input
      type="email"
      placeholder="Email Id"
      [(ngModel)]="email"
    >

    <div class="password-wrapper">
      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        [(ngModel)]="password"
      >
      <span class="toggle-icon" (click)="togglePassword()">
        {{ showPassword ? '🙈' : '👁️' }}
      </span>
    </div>

    <button class="login-btn" (click)="login()" [disabled]="loading">
      <span *ngIf="!loading">Login</span>
      <span *ngIf="loading" class="spinner"></span>
    </button>

    <div class="links">
<a (click)="forgotPassword()">Forgot password?</a>    </div>

    <div class="links">
      New member? <a routerLink="/register">Sign Up</a>
    </div>

  </div>

</div>
